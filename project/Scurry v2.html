<style>
html,body{margin:0;height:100%;overflow:hidden;background:#120e0b;font-family:var(--font-body);color:var(--color-text)}

.pill{display:flex;align-items:center;gap:8px;background:var(--color-bg);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow-md);font-weight:700;font-size:14px;white-space:nowrap}

.bar{position:relative;height:10px;border-radius:999px;background:var(--color-neutral-200);overflow:hidden}
.bar>i{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:999px;background:var(--color-accent)}

#xp .bar>i{background:var(--color-accent-2-300)}

#tl{position:absolute;left:20px;top:42px;display:flex;flex-direction:column;gap:8px;align-items:flex-start}

#tc{position:absolute;left:50%;top:40px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:8px}

#tr{position:absolute;right:20px;top:42px;display:flex;flex-direction:column;gap:8px;align-items:flex-end}
#load{position:absolute;left:20px;bottom:20px;display:flex;gap:6px;flex-wrap:wrap;max-width:40vw}
#spec{position:absolute;left:50%;bottom:22px;transform:translateX(-50%)}

#spec .bar>i{background:var(--color-accent-2)}
#prompt{position:absolute;left:50%;bottom:74px;transform:translateX(-50%);display:none}

.panel h2{font-family:var(--font-heading);font-size:clamp(28px,3.6vw,42px);line-height:1;margin:0}
.panel p{margin:0;text-wrap:pretty;line-height:1.5}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}

const FLOOR={x:0,z:0,y:0,w:999,d:999,th:1,floor:true};
function collideBody(b,prevY,R,H){
  let g=null;b.blocked=null;
  for(const p of plats){
    const hw=p.w/2+R,hd=p.d/2+R,lx=b.x-p.x,lz=b.z-p.z;
    if(lx>hw||lx<-hw||lz>hd||lz<-hd)continue;
    const top=p.y,bot=p.y-p.th;
    if(b.vy<=0&&prevY>=top-.08&&b.y<=top+.001){b.y=top;b.vy=0;g=p;}
    else if(b.vy>0&&prevY+H<=bot+.05&&b.y+H>bot){b.y=bot-H;b.vy=0;}
    else if(b.y<top-.08&&b.y+H>bot){b.blocked=p;if(hw-Math.abs(lx)<hd-Math.abs(lz))b.x=p.x+Math.sign(lx||1)*hw;else b.z=p.z+Math.sign(lz||1)*hd;}
  }
  if(b.y<=0&&b.vy<=0){b.y=0;b.vy=0;g=g||FLOOR;}
  b.x=clamp(b.x,-ARENA,ARENA);b.z=clamp(b.z,-ARENA,ARENA);return g;
}

      if(e.fly){mx+=Math.sin(time*2+e.ph)*.4*mz;mz-=Math.sin(time*2+e.ph)*.4*mx;}
      e.x+=(mx*sp+e.kx)*dt;e.z+=(mz*sp+e.kz)*dt;e.ang=Math.atan2(e.ranged?dx:mx,e.ranged?dz:mz);
      if(e.fly){e.y+=((P.y+1.1+Math.sin(time*3+e.ph)*.4)-e.y)*Math.min(1,2*dt);e.x=clamp(e.x,-ARENA,ARENA);e.z=clamp(e.z,-ARENA,ARENA);}
      else{const py=e.y;e.vy-=G*dt;e.y+=e.vy*dt;const g=collideBody(e,py,e.r,e.h);
        if(e.leap&&e.blocked&&g&&P.y>e.y+.5&&d<7)e.vy=Math.sqrt(2*G*(e.blocked.y-e.y+.8));}
      if(d>42&&!e.boss){const p=ringPos(20,26);if(p){e.x=p[0];e.z=p[1];e.y=e.fly?P.y+3:0;}}
    }
    const k=Math.exp(-7*dt);e.kx*=k;e.kz*=k;
    const cr=e.r+.3;if(d<cr&&P.y<e.y+e.h&&P.y+.9>e.y)hurtP(e.dmg);
  }
  // separation
  for(let i=0;i<enemies.length;i++){const a=enemies[i];if(a.dead||a.type==='nest')continue;
    for(let j=i+1;j<enemies.length;j++){const b=enemies[j];if(b.dead||b.type==='nest')continue;const dx=b.x-a.x,dz=b.z-a.z,rr=a.r+b.r;if(dx>rr||dx<-rr||dz>rr||dz<-rr)continue;const d2=dx*dx+dz*dz;
      if(d2<rr*rr&&d2>1e-4&&Math.abs(a.y-b.y)<1){const d=Math.sqrt(d2),p=(rr-d)*.5/d;const wa=a.boss?0:b.boss?1:.5;a.x-=dx*p*2*wa;a.z-=dz*p*2*wa;b.x+=dx*p*2*(1-wa);b.z+=dz*p*2*(1-wa);}}}
  enemies=enemies.filter(e=>!e.dead);
  // projectiles
  for(const p of pproj){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;
    for(const e of enemies){if(e.dead||p.hs.has(e))continue;const dx=e.x-p.x,dz=e.z-p.z,rr=e.r+.25;if(dx*dx+dz*dz<rr*rr&&p.y>e.y-.2&&p.y<e.y+e.h+.3){p.hs.add(e);hit(e,p.dmg,Math.atan2(p.vx,p.vz),3,p.src);if(p.pierce--<=0){p.life=0;break;}}}}
  pproj=pproj.filter(p=>p.life>0);
  for(const p of eproj){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.z+=p.vz*dt;const dx=P.x-p.x,dy=P.y+.5-p.y,dz=P.z-p.z;if(dx*dx+dy*dy+dz*dz<.45){hurtP(p.dmg);p.life=0;}}
  eproj=eproj.filter(p=>p.life>0&&Math.abs(p.x)<ARENA+2&&Math.abs(p.z)<ARENA+2);
  for(const b of flasks){if(!b.on)continue;b.t+=dt;const u=Math.min(1,b.t/.65);b.m.position.set(b.sx+(b.tx-b.sx)*u,b.sy+(b.ty-b.sy)*u+Math.sin(Math.PI*u)*3.5,b.sz+(b.tz-b.sz)*u);b.m.rotation.x+=dt*10;
    if(u>=1){b.on=false;b.m.visible=false;aoe(b.tx,b.ty,b.tz,b.R,b.dm,6,'bomb',1);fx('disc',b.tx,b.ty,b.tz,b.R,0x7a8a5e,.45,0,.55);fx('ring',b.tx,b.ty,b.tz,b.R,0xa9bd84,.35);puff(b.tx,b.ty+.3,b.tz,0xa9bd84,12,3.5);}}
  // pickups
  const mr=st.magnet*st.magnet;
  const pull=(o,dt)=>{const dx=P.x-o.x,dy=P.y+.5-o.y,dz=P.z-o.z,d2=dx*dx+dy*dy+dz*dz;if(!o.pull&&d2<mr)o.pull=true;if(o.pull){o.s=Math.min(30,(o.s||6)+40*dt);const d=Math.sqrt(d2)||1,s=Math.min(d,o.s*dt);o.x+=dx/d*s;o.y+=dy/d*s;o.z+=dz/d*s;}return d2<.36;};
  gems=gems.filter(g=>{if(pull(g,dt)){gainXP(g.v);return false;}return true;});
  coins=coins.filter(c=>{if(pull(c,dt)){run.gold++;return false;}return true;});
  foods=foods.filter(f=>{f.m.position.set(f.x,f.y+.4+Math.sin(time*3)*.1,f.z);f.m.rotation.y+=dt*2;const dx=P.x-f.x,dz=P.z-f.z;
    if(dx*dx+dz*dz<1&&Math.abs(P.y-f.y)<1.2){world.remove(f.m);if(f.kind==='food'){const h=Math.round(st.maxHp*.3);run.hp=Math.min(st.maxHp,run.hp+h);dnum(P.x,P.y+1.6,P.z,'+'+h+' HP','info');}else{gems.forEach(g=>g.pull=true);coins.forEach(c=>c.pull=true);dnum(P.x,P.y+1.6,P.z,'Everything is yours','info');}return false;}return true;});
  // chests & portal
  const c=nearChest(),pr=$('prompt');
  if(c){pr.style.display='flex';pr.innerHTML=`<span class="tag tag-neutral">E</span>${c.cost?`Open chest · ${c.cost} gold`:'Open chest · free'}`;}else pr.style.display='none';
  for(const ch of chests)if(ch.open&&ch.lid.rotation.x>-1.8)ch.lid.rotation.x-=dt*6;
  if(portal){portal.ring.rotation.z+=dt*2;if(Math.hypot(P.x,P.z)<1.8&&P.y<1)nextStage();}
}

// ---------- render sync ----------
function sync(dt){
  const cnt={};for(const k in IM)cnt[k]=0;
  for(const e of enemies){
    if(e.mesh){if(!e.boss)continue;e.mesh.position.set(e.x,e.y,e.z);e.mesh.rotation.y=e.ang;e.mesh.material.emissive.setScalar(e.flash>0?.5:e.mode==='wind'||e.mode==='tele'?.15+.15*Math.sin(time*30):0);continue;}
    const m=IM[e.type],i=cnt[e.type]++;if(i>=320)continue;
    dummy.position.set(e.x,e.y+(e.fly?0:Math.abs(Math.sin(time*14+e.ph))*.05),e.z);dummy.rotation.set(0,e.ang,e.fly?Math.sin(time*10+e.ph)*.3:0);dummy.scale.setScalar(1);dummy.updateMatrix();m.setMatrixAt(i,dummy.matrix);
    m.setColorAt(i,e.flash>0?tmpC.setScalar(4):e.slow>0?tmpC.setRGB(.75,1.1,.7):tmpC.setScalar(1));}
  for(const k in IM){const m=IM[k];m.count=Math.min(320,cnt[k]);m.instanceMatrix.needsUpdate=true;if(m.instanceColor)m.instanceColor.needsUpdate=true;}
  const put=(im,arr,f)=>{let n=0;for(const o of arr){if(n>=im.instanceMatrix.count)break;f(o);dummy.updateMatrix();im.setMatrixAt(n++,dummy.matrix);}im.count=n;im.instanceMatrix.needsUpdate=true;};
  put(gemIM,gems,g=>{dummy.position.set(g.x,g.y+.35+Math.sin(time*3+g.ph)*.08,g.z);dummy.rotation.set(0,time*2+g.ph,0);dummy.scale.setScalar(g.v>=10?2:g.v>=3?1.4:1);});
  put(coinIM,coins,c=>{dummy.position.set(c.x,c.y+.35,c.z);dummy.rotation.set(PI2,time*3+c.ph,0);dummy.scale.setScalar(1);});
  put(pprojIM,pproj,p=>{dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(0,0,0);dummy.scale.setScalar(1);});
  put(eprojIM,eproj,p=>{dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(time*5,time*3,0);dummy.scale.setScalar(1);});
  for(const p of parts){p.life-=dt;p.vy-=14*dt;p.x+=p.vx*dt;p.y=Math.max(0,p.y+p.vy*dt);p.z+=p.vz*dt;}
  parts=parts.filter(p=>p.life>0);
  let n=0;for(const p of parts){dummy.position.set(p.x,p.y,p.z);dummy.rotation.set(p.life*9,p.life*7,0);dummy.scale.setScalar(Math.min(1,p.life*2.5));dummy.updateMatrix();partIM.setMatrixAt(n,dummy.matrix);partIM.setColorAt(n,tmpC.setHex(p.c));n++;}
  partIM.count=n;partIM.instanceMatrix.needsUpdate=true;if(partIM.instanceColor)partIM.instanceColor.needsUpdate=true;
  for(const f of fxs){if(!f.on)continue;f.life-=dt;const k=1-f.life/f.max;if(f.life<=0){f.on=false;f.g.visible=false;continue;}
    const s=f.kind==='ring'?f.R*(.25+.75*k):f.R;f.g.scale.setScalar(s);f.m.material.opacity=f.kind==='tele'?.35+.35*Math.sin(time*25):f.op*(1-k);}
  for(const b of bolts){if(!b.on)continue;b.life-=dt;b.l.material.opacity=Math.max(0,b.life/.16);if(b.life<=0){b.on=false;b.l.visible=false;}}
  for(const c of chests){if(!c.open)c.beam.material.opacity=.1+.06*Math.sin(time*3);}
  torches.forEach((l,i)=>l.intensity=2.6+Math.sin(time*9+i*3)*.35+Math.sin(time*23+i)*.2);
}
function animate(dt){
  if(!rat)return;
  const mv=Math.hypot(P.vx,P.vz),r01=Math.min(1,mv/5);
  rat.g.position.set(P.x,P.y,P.z);rat.g.rotation.y+=angD(P.facing,rat.g.rotation.y)*(1-Math.exp(-18*dt));
  rat.body.position.y=.45+(P.onGround?Math.abs(Math.sin(time*18))*.06*r01:0);rat.body.rotation.x=P.onGround?.08*r01:-.1;
  rat.head.position.y=.62+(P.onGround?Math.sin(time*18)*.025*r01:.04);
  const sy=P.onGround?1:clamp(1+P.vy*.012,.88,1.15);rat.g.scale.set(1/Math.sqrt(sy),sy,1/Math.sqrt(sy));
  rat.feet.forEach((f,i)=>f.position.y=.07+(P.onGround?Math.max(0,Math.sin(time*18+(i%2?0:Math.PI)+(i>1?Math.PI:0)))*.12*r01:.05));
  rat.tail.forEach((s,i)=>{s.rotation.y=Math.sin(time*(4+r01*6)-i*.55)*(.18+r01*.1);s.rotation.x=i?(P.onGround?-.03:.1):-.2;});
  rat.g.visible=P.inv>0&&state==='play'?Math.floor(time*24)%2===0:true;
  let gy=0;for(const p of plats)if(Math.abs(P.x-p.x)<p.w/2&&Math.abs(P.z-p.z)<p.d/2&&p.y<=P.y+.05&&p.y>gy)gy=p.y;
  blob.position.set(P.x,gy+.02,P.z);blob.scale.setScalar(clamp(1-(P.y-gy)*.08,.4,1));
  const tgt=_v.set(P.x,P.y+1.1,P.z),dist=9.5;
  const want=new V3(tgt.x-Math.sin(camYaw)*dist*Math.cos(camPitch),tgt.y+dist*Math.sin(camPitch),tgt.z-Math.cos(camYaw)*dist*Math.cos(camPitch));
  camPos.lerp(want,1-Math.exp(-10*dt));camLook.lerp(tgt,1-Math.exp(-14*dt));
  shake=Math.max(0,shake-dt*1.6);camera.position.copy(camPos).add(new V3(rand(-1,1),rand(-1,1),rand(-1,1)).multiplyScalar(shake*.5));camera.lookAt(camLook);
  moon.position.set(P.x+10,P.y+24,P.z-8);moon.target.position.set(P.x,P.y,P.z);lantern.position.set(P.x,P.y+2.2,P.z);
  flash=Math.max(0,flash-dt*3);post.uniforms.hurt.value=flash;post.uniforms.time.value=time;
  post.uniforms.low.value=state==='play'&&run.hp<st.maxHp*.3?1:0;
}

// ---------- HUD / screens ----------
let hudT=0;
function hud(){
  $('hpFill').style.width=clamp(run.hp/st.maxHp*100,0,100)+'%';$('hpTxt').textContent=Math.ceil(Math.max(0,run.hp))+' / '+st.maxHp;
  $('xpFill').style.width=(run.xp/run.need*100)+'%';$('lvl').textContent='Lv '+run.level;
  $('clock').textContent=fmt(run.stageTime);$('kills').textContent=run.kills;$('gold').textContent=run.gold;
  $('obj').textContent=portal?'Portal open — head to the centre':boss?`Nests ${nestsTotal-nestsLeft}/${nestsTotal} · Boss awake`:`Nests ${nestsTotal-nestsLeft}/${nestsTotal} · Boss in ${fmt(Math.max(0,BOSS_AT-run.stageTime))}`;
  $('boss').style.display=boss?'flex':'none';if(boss)$('bossFill').style.width=(boss.hp/boss.maxHp*100)+'%';
  const S=SPECIALS[CLASSES[run.cls].special];$('specFill').style.width=((1-run.specT/(S.cd*st.cd))*100)+'%';
}
function loadout(){
  $('load').innerHTML=run.weapons.map(w=>`<span class="tag tag-accent">${WEAP[w.id].name} · ${w.lvl}</span>`).join('')+Object.keys(run.tomes).map(k=>`<span class="tag tag-neutral">${TOMES[k].name.replace('Tome of ','')} · ${run.tomes[k]}</span>`).join('');
}
let bannerT;function banner(t,s){const b=$('banner');b.innerHTML=t+(s?`<small>${s}</small>`:'');b.classList.add('on');clearTimeout(bannerT);bannerT=setTimeout(()=>b.classList.remove('on'),2400);}
const ov=$('overlay');
function show(h){ov.innerHTML=h;ov.classList.remove('hide');if(locked())document.exitPointerLock();}
function hide(){ov.classList.add('hide');document.activeElement?.blur();}
function menu(){
  state='menu';$('hud').style.display='none';run={stage:0};st={area:1,dmg:1,cd:1,proj:0};genArena();setRat(CLASSES.brawler);Object.assign(P,{x:0,y:0,z:0,vx:0,vy:0,vz:0});
  show(`<div class="panel wide card elev-lg">
    <span class="tag tag-accent-2" style="align-self:flex-start">Vermin legacy</span>
    <h1>Scurry</h1>
    <p>The hordes pour from the nests. Pick your rat, survive the swarm, smash every nest, then face what's waiting below. Endless floors, and it only gets worse.</p>
    <div class="opts">${Object.entries(CLASSES).map(([k,C],i)=>`<button class="opt" data-k="${k}">
      <div class="row"><span class="tag tag-outline">${i+1}</span><span class="tag ${['tag-accent','tag-accent-2','tag-neutral','tag-accent-2'][i]}">${C.role}</span></div>
      <b>${C.name}</b><span class="d">${C.blurb}</span>
      <span class="s">${C.hp} HP · ${WEAP[C.weapon].name} · ${SPECIALS[C.special].name}</span></button>`).join('')}</div>
    <p class="muted">Best: ${best.stage?`floor ${best.stage}, ${best.kills} kills, ${fmt(best.time)}`:'no runs yet'} · WASD, Space, mouse, Shift, E</p>
  </div>`);
  ov.querySelectorAll('.opt').forEach(b=>b.onclick=()=>startRun(b.dataset.k));
}
function resetPlayer(){Object.assign(P,{x:0,y:0,z:0,vx:0,vy:0,vz:0,inv:1,slam:false,lock:0});camPos.set(0,6,-9);}
function startRun(k){
  const C=CLASSES[k];
  run={cls:k,stage:0,level:1,xp:0,need:need(1),kills:0,gold:0,time:0,stageTime:0,weapons:[{id:C.weapon,lvl:1,t:0}],tomes:{},dmgBy:{},chestCost:10,pendingLv:0,bossSpawned:false,bossDead:false,surgeT:45,spawnT:1,specT:0,lowWarned:false,hp:C.hp};
  st={maxHp:C.hp,regen:0,armor:C.armor||0,speed:C.speed,dmg:1,area:C.area||1,cd:C.cd||1,proj:0,magnet:3,crit:.05,xp:1,jumps:0};
  setRat(C);genArena();resetPlayer();camYaw=0;hide();$('hud').style.display='block';$('clsName').textContent=C.name;$('stageName').textContent=stageLabel();$('specName').textContent=SPECIALS[C.special].name;
  loadout();state='play';last=performance.now();banner(stageLabel(),'Smash the nests — or survive until the boss arrives');
}
function nextStage(){
  run.stage++;run.stageTime=0;run.bossSpawned=false;run.bossDead=false;run.surgeT=45;run.spawnT=1.5;
  genArena();resetPlayer();run.hp=Math.min(st.maxHp,run.hp+st.maxHp*.3);$('stageName').textContent=stageLabel();banner(stageLabel(),'Deeper. Hungrier.');
}
function pause(on){
  if(on){state='paused';show(`<div class="panel card elev-lg"><h2>Paused</h2><p>${stageLabel()} · Lv ${run.level} · ${run.kills} kills</p><div class="row">${run.weapons.map(w=>`<span class="tag tag-accent">${WEAP[w.id].name} · ${w.lvl}</span>`).join('')}</div>
    <div class="row"><button class="btn btn-primary" id="res">Resume</button><button class="btn btn-ghost" id="quit">Abandon run</button></div></div>`);
    $('res').onclick=()=>pause(false);$('quit').onclick=()=>{run.hp=0;die();};}
  else{hide();state='play';last=performance.now();}
}
let offers=[],lvSrc='level';
function makeOffers(bonus){
  const pool=[];
  for(const w of run.weapons)if(w.lvl<5)pool.push({kind:'up',id:w.id,wt:3});
  if(run.weapons.length<4)for(const id in WEAP)if(!run.weapons.some(w=>w.id===id))pool.push({kind:'new',id,wt:2});
  for(const id in TOMES)if((run.tomes[id]||0)<(TOMES[id].max||5))pool.push({kind:'tome',id,wt:2});
  const out=[];while(out.length<3&&pool.length){let tot=pool.reduce((a,b)=>a+b.wt,0),r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].wt;if(r<=0)break;}const o=pool.splice(Math.min(i,pool.length-1),1)[0];
    if(o.kind==='tome'&&!TOMES[o.id].flat){const q=Math.random()-bonus;o.rar=q<.02?3:q<.12?2:q<.4?1:0;}else o.rar=0;out.push(o);}
  if(!out.length)out.push({kind:'heal',rar:0});return out;
}
function openLevelUp(src){
  lvSrc=src;state='levelup';offers=makeOffers(src==='chest'?.35:0);
  show(`<div class="panel wide card elev-lg">
    <div class="row"><span class="tag tag-accent">${src==='chest'?'Chest opened':'Level '+run.level}</span>${run.pendingLv>1&&src==='level'?`<span class="tag tag-neutral">${run.pendingLv-1} more to pick</span>`:''}</div>
    <h2>${src==='chest'?'Something glints inside':'Choose a gift from the dark'}</h2>
    <div class="opts">${offers.map((o,i)=>{
      if(o.kind==='heal')return`<button class="opt" data-i="${i}"><span class="tag tag-outline" style="align-self:flex-start">${i+1}</span><b>Stale Cheese</b><span class="d">Restore 50% HP.</span></button>`;
      const T=o.kind==='tome'?TOMES[o.id]:null,W=WEAP[o.id],R=RAR[o.rar],lvl=o.kind==='up'?run.weapons.find(w=>w.id===o.id).lvl:0;
      return`<button class="opt" data-i="${i}"><div class="row"><span class="tag tag-outline">${i+1}</span><span class="tag ${o.kind==='new'?'tag-accent':o.kind==='up'?'tag-accent-2':R.cls}">${o.kind==='new'?'New · '+W.role:o.kind==='up'?'Level '+(lvl+1):R.n+' tome'}</span></div>
        <b>${T?T.name:W.name}</b><span class="d">${T?T.d(R.m):o.kind==='new'?W.desc:W.lv[lvl-1]}</span></button>`;}).join('')}</div>
  </div>`);
  ov.querySelectorAll('.opt').forEach(b=>b.onclick=()=>choose(offers[+b.dataset.i]));
}
function choose(o){
  if(o.kind==='new')run.weapons.push({id:o.id,lvl:1,t:0});
  else if(o.kind==='up')run.weapons.find(w=>w.id===o.id).lvl++;
  else if(o.kind==='tome'){run.tomes[o.id]=(run.tomes[o.id]||0)+1;TOMES[o.id].ap(RAR[o.rar].m);}
  else run.hp=Math.min(st.maxHp,run.hp+st.maxHp*.5);
  if(lvSrc==='level')run.pendingLv--;loadout();
  if(run.pendingLv>0)openLevelUp('level');else{hide();state='play';last=performance.now();}
}
function die(){
  state='dead';const reached=run.stage+1;
  const nb=reached>best.stage||(reached===best.stage&&run.kills>best.kills);if(nb)Object.assign(best,{stage:reached,kills:run.kills,time:run.time});localStorage.setItem('scurry2.best',JSON.stringify(best));
  const names={...Object.fromEntries(Object.entries(WEAP).map(([k,w])=>[k,w.name])),special:SPECIALS[CLASSES[run.cls].special].name};
  const dmg=Object.entries(run.dmgBy).sort((a,b)=>b[1]-a[1]);
  show(`<div class="panel card elev-lg">
    <span class="tag ${nb?'tag-accent':'tag-neutral'}" style="align-self:flex-start">${nb?'New best':'Run over'}</span>
    <h2>Overrun in ${stageLabel()}</h2>
    <div class="row"><span class="tag tag-neutral">${fmt(run.time)} survived</span><span class="tag tag-neutral">Lv ${run.level}</span><span class="tag tag-neutral">${run.kills} kills</span><span class="tag tag-neutral">Floor ${reached}</span></div>
    <div class="dmg">${dmg.map(([k,v])=>`<span>${names[k]||k}</span><b>${v.toLocaleString()}</b>`).join('')}</div>
    <div class="row"><button class="btn btn-primary" id="again">Pick a rat</button><span class="muted">or press R</span></div>
  </div>`);
  $('again').onclick=menu;
}

// ---------- loop ----------
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(state==='play'){update(dt);hudT-=dt;if(hudT<=0){hudT=.08;hud();}}
  else if(state==='menu'){camYaw+=dt*.12;P.facing+=dt*.5;}
  sync(state==='play'||state==='menu'?dt:0);animate(dt);
  renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);
}
menu();requestAnimationFrame(loop);
</script>
