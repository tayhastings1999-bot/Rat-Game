<style>
:root{--ink:#f4efe6;--dim:#b3aab6;--hp:#d8342c;--en:#3a8fe0;--xp:#4aa3ff;--gold:#f2b233;--m0:#0b090c;--m1:#141116;--m2:#221e26;--m3:#3a3540;--m4:#5e5868;--red:#e0382c}

a{color:var(--gold)}a:hover{color:#ffd070}

.frame{background:linear-gradient(180deg,#26222b,#131015);border:2px solid var(--m4);box-shadow:inset 0 0 0 2px var(--m0),inset 0 3px 0 2px rgba(255,255,255,.05);clip-path:polygon(12px 0,calc(100% - 12px) 0,100% 12px,100% calc(100% - 12px),calc(100% - 12px) 100%,12px 100%,0 calc(100% - 12px),0 12px)}
#hud{position:fixed;inset:0;pointer-events:none;display:none}

.pinfo{display:flex;flex-direction:column;gap:6px;min-width:260px}

#bars{position:fixed;inset:0;pointer-events:none}

.num.crit{color:#fff;font-size:24px}.num.info{color:#bfe6ff;font-size:16px}.num.poison{color:#9be06a}.num.burn{color:#ff9a3a}.num.heal{color:#ff7a7a;font-size:17px}

.card{all:unset;box-sizing:border-box;cursor:pointer;display:flex;flex-direction:column;gap:9px;padding:16px;background:linear-gradient(180deg,#221e26,#121014);border:2px solid var(--rc,#5e5868);box-shadow:inset 0 0 0 2px #0b090c;transition:transform .12s,box-shadow .12s}

.card .ico{width:44px;height:44px;border:2px solid var(--rc);display:flex;align-items:center;justify-content:center;color:var(--rc);background:#000}
.card b{font-family:'Pirata One';font-weight:400;font-size:30px;line-height:1;color:var(--ink)}
.card .d{font-size:16px;line-height:1.4;color:var(--dim)}
.card .s{font-family:'Silkscreen';font-size:11px;color:var(--ink);line-height:1.6}
.btns{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{all:unset;cursor:pointer;font-family:'Silkscreen';font-size:15px;padding:12px 20px;background:linear-gradient(180deg,#9a1e16,#5a0e0a);border:2px solid var(--red);color:var(--ink);box-shadow:inset 0 0 0 2px #000}
.btn:hover{background:linear-gradient(180deg,#c02a1e,#7a140e)}.btn:active{background:#5a0e0a}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.btn.ghost{background:#141116;border-color:var(--m4)}.btn.ghost:hover{background:#221e26}
.stat{display:flex;gap:28px;flex-wrap:wrap}
.stat div{display:flex;flex-direction:column}.stat b{font-size:28px}.stat span{font-size:12px;color:var(--dim)}
.dbar{display:grid;grid-template-columns:160px 1fr 90px;gap:6px 12px;align-items:center;font-family:'Silkscreen';font-size:12px}
.dbar i{display:block;height:10px;background:linear-gradient(90deg,#d8342c,#ff8a3a)}
.tags{display:flex;gap:6px;flex-wrap:wrap}
.tags span{font-family:'Silkscreen';font-size:11px;padding:4px 8px;border:2px solid var(--m4);background:#000}

<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
const V3=THREE.Vector3,TAU=Math.PI*2,PI2=Math.PI/2;
const rand=(a,b)=>a+Math.random()*(b-a),randi=(a,b)=>Math.floor(rand(a,b+1)),clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const angD=(a,b)=>{const d=a-b;return((d+Math.PI)%TAU+TAU)%TAU-Math.PI;};
const $=id=>document.getElementById(id),hexs=h=>'#'+h.toString(16).padStart(6,'0'),rgb=h=>[h>>16&255,h>>8&255,h&255];
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(Math.floor(s%60)).padStart(2,'0');
const commas=n=>Math.round(n).toLocaleString('en-US');

// ---------- renderer + light pixel post ----------
const canvas=$('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance'});
renderer.setPixelRatio(1);renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;
const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(55,1,.1,160);
const rt=new THREE.WebGLRenderTarget(2,2,{minFilter:THREE.NearestFilter,magFilter:THREE.NearestFilter});
const post=new THREE.ShaderMaterial({
  uniforms:{t:{value:rt.texture},time:{value:0},res:{value:new THREE.Vector2(2,2)},hurt:{value:0},low:{value:0}},
  vertexShader:`varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}`,
  fragmentShader:`uniform sampler2D t;uniform float time,hurt,low;uniform vec2 res;varying vec2 vUv;
  float hash(vec2 p){return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453);}
  void main(){
    vec2 o=(vUv-.5)*.0016;
    vec3 c=vec3(texture2D(t,vUv+o).r,texture2D(t,vUv).g,texture2D(t,vUv-o).b);
    c=pow(max(c,0.),vec3(1./2.2));
    float l=dot(c,vec3(.3,.59,.11));c=mix(vec3(l),c,1.12);c=(c-.5)*1.06+.52;
    c+=(hash(floor(vUv*res)+fract(time*7.)*vec2(37.,91.))-.5)*.03;
    vec2 q=vUv-.5;float v=dot(q,q);c*=1.-v*.55;
    c=mix(c,vec3(.7,.08,.05),clamp(hurt*.45+low*v*1.8*(.6+.4*sin(time*6.)),0.,.65));
    gl_FragColor=vec4(c,1.);
  }`
});
const postScene=new THREE.Scene(),postCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),post));
function resize(){const W=Math.max(320,Math.floor(innerWidth/2)),H=Math.max(180,Math.floor(innerHeight/2));renderer.setSize(W,H,false);rt.setSize(W,H);post.uniforms.res.value.set(W,H);camera.aspect=W/H;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

const hemi=new THREE.HemisphereLight(0xfff0dc,0x4a3a32,1.35);
const sun=new THREE.DirectionalLight(0xfff0e0,1.3);sun.position.set(9,26,7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.bias=-.0015;
Object.assign(sun.shadow.camera,{left:-20,right:20,top:20,bottom:-20,near:1,far:60});sun.shadow.camera.updateProjectionMatrix();
const braz=[0,1,2,3].map(()=>{const l=new THREE.PointLight(0xff8a3a,5,22,1.3);scene.add(l);return l;});
const lantern=new THREE.PointLight(0xffd0a0,1.6,10,1.5);
scene.add(hemi,sun,sun.target,lantern);

// ---------- textures ----------
function ctex(size,draw,{rep=[1,1],srgb=true}={}){const cv=document.createElement('canvas');cv.width=cv.height=size;const x=cv.getContext('2d');draw(x,size);
  const t=new THREE.CanvasTexture(cv);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(...rep);t.magFilter=THREE.NearestFilter;if(srgb)t.colorSpace=THREE.SRGBColorSpace;return t;}
const furTex=ctex(64,(x,s)=>{x.fillStyle='#e8e8e8';x.fillRect(0,0,s,s);for(let i=0;i<460;i++){const v=randi(175,255);x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(randi(0,s-1),randi(0,s-1),1,randi(2,6));}},{srgb:false});
const stoneTex=ctex(64,(x,s)=>{x.fillStyle='#e4e4e4';x.fillRect(0,0,s,s);for(let i=0;i<320;i++){const v=randi(170,255);x.fillStyle=`rgb(${v},${v},${v})`;x.fillRect(randi(0,s-1),randi(0,s-1),randi(1,3),randi(1,3));}},{srgb:false});
const flameTex=ctex(64,(x)=>{const g=x.createRadialGradient(32,34,2,32,34,30);g.addColorStop(0,'rgba(255,250,225,1)');g.addColorStop(.3,'rgba(255,200,110,.9)');g.addColorStop(.7,'rgba(255,100,40,.3)');g.addColorStop(1,'rgba(255,60,20,0)');x.fillStyle=g;x.fillRect(0,0,64,64);});
const texCache={};
function floorTex(F){const k='f'+F.name;if(texCache[k])return texCache[k];const[r,g,b]=rgb(F.f1);
  return texCache[k]=ctex(256,(x,s)=>{x.fillStyle=hexs(F.f2);x.fillRect(0,0,s,s);const T=32;
    for(let j=0;j<s/T;j++)for(let i=0;i<s/T;i++){const k=rand(.84,1.14),off=(j%2)*T/2;x.fillStyle=`rgb(${Math.min(255,r*k)|0},${Math.min(255,g*k)|0},${Math.min(255,b*k)|0})`;x.fillRect((i*T+off)%s+1,j*T+1,T-2,T-2);if(off&&i===s/T-1)x.fillRect(1,j*T+1,T/2-2,T-2);}
    for(let n=0;n<1600;n++){x.fillStyle=`rgba(0,0,0,${rand(.03,.16)})`;x.fillRect(randi(0,s-1),randi(0,s-1),1,1);}
    x.strokeStyle='rgba(0,0,0,.28)';for(let n=0;n<12;n++){x.beginPath();let px=rand(0,s),py=rand(0,s);x.moveTo(px,py);for(let q=0;q<4;q++){px+=rand(-10,10);py+=rand(-10,10);x.lineTo(px,py);}x.stroke();}
  },{rep:[2.125,1.625]});}
function wallTex(F){const k='w'+F.name;if(texCache[k])return texCache[k];const[r,g,b]=rgb(F.wall);
  return texCache[k]=ctex(64,(x,s)=>{x.fillStyle=`rgb(${r*.5|0},${g*.5|0},${b*.5|0})`;x.fillRect(0,0,s,s);
    for(let j=0;j<4;j++)for(let i=0;i<3;i++){const k=rand(.85,1.15),o=(j%2)*11;x.fillStyle=`rgb(${Math.min(255,r*k)|0},${Math.min(255,g*k)|0},${Math.min(255,b*k)|0})`;x.fillRect((i*22+o)%s+1,j*16+1,20,14);if(o&&i===2)x.fillRect(1,j*16+1,9,14);}
    for(let n=0;n<220;n++){x.fillStyle=`rgba(0,0,0,${rand(.05,.2)})`;x.fillRect(randi(0,s-1),randi(0,s-1),1,1);}});}
function runeTex(col){const k='r'+col;if(texCache[k])return texCache[k];
  return texCache[k]=ctex(256,(x)=>{x.strokeStyle=col;x.shadowColor=col;x.shadowBlur=10;x.lineWidth=5;x.beginPath();x.arc(128,128,112,0,TAU);x.stroke();x.lineWidth=2;x.beginPath();x.arc(128,128,94,0,TAU);x.stroke();
    x.beginPath();for(let i=0;i<=7;i++){const a=-PI2+i*TAU*3/7,px=128+Math.cos(a)*94,py=128+Math.sin(a)*94;i?x.lineTo(px,py):x.moveTo(px,py);}x.stroke();
    for(let i=0;i<14;i++){const a=i/14*TAU;x.save();x.translate(128+Math.cos(a)*103,128+Math.sin(a)*103);x.rotate(a);x.fillStyle=col;x.fillRect(-3,-5,6,2);x.fillRect(-1,-5,2,10);x.restore();}});}
function scaleUV(geo,sx,sy){const uv=geo.attributes.uv;for(let i=0;i<uv.count;i++)uv.setXY(i,uv.getX(i)*sx,uv.getY(i)*sy);return geo;}

// ---------- geometry kit ----------

    <h1>Scurry</h1>
    <p>Room by room, floor by floor, down through the warrens. Clear every chamber of the horde, raid treasure altars, bribe the rat market, and break whatever guards the trapdoor. Your rat grows stronger with every kill.</p>
    <div class="cards">${Object.entries(CLASSES).map(([k,C],i)=>`<button class="card" data-k="${k}" style="--rc:${C.rc}">
      <div class="row"><span class="key px">${i+1}</span><span class="role">${C.role}</span></div>
      <img class="por" src="${PORT[k]}" alt="">
      <b>${C.name}</b><span class="d">${C.blurb}</span>
      <span class="s">${C.hp} HP · ${PRIM[C.prim].name}<br>Special: ${SPECIALS[C.special].name}</span></button>`).join('')}</div>
    <p class="px" style="font-size:12px">${best.floor?`Best: floor ${best.floor} · ${best.kills} kills · ${fmt(best.time)}`:'No runs yet'} &nbsp;·&nbsp; Drag to orbit, right-drag to pan, wheel to zoom</p>
  </div>`);
  ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>startRun(b.dataset.k));}
function startRun(k){
  const C=CLASSES[k];
  run={cls:k,floor:1,level:1,xp:0,need:need(1),kills:0,dmg:0,coins:3,keys:1,bombs:1,time:0,weapons:[],items:[],tomes:{},dmgBy:{},pendingLv:0,combat:false,wave:0,waves:0,specT:0,primT:0,roomsCleared:0,lowWarned:false,hp:C.hp,
    pool:Object.keys(ITEMS).filter(i=>i!=='cheese').sort(()=>Math.random()-.5)};
  st={maxHp:C.hp,regen:0,armor:C.armor||0,speed:C.speed,dmg:1,area:C.area||1,cd:C.cd||1,proj:0,magnet:2.6,crit:.05,xp:1,jumps:0,multi:0,range:1,shotSpd:1,tear:1,homing:false,poison:false,burn:false,split:false,shotSize:0,feast:0,thorns:0};
  familiars.forEach(f=>scene.remove(f.r.g));familiars=[];
  setRat(C);state='play';genFloor();room=null;enterRoom(floor.rooms[0]);camYaw=Math.PI;camPitch=.95;camDist=14;camOff.set(0,0,0);
  hide();$('hud').style.display='block';$('clsName').textContent=C.name;$('portrait').src=FACE[k];$('floorName').textContent=floorLabel();
  renderSlots();hud();last=performance.now();banner(floorLabel(),'Clear the rooms. Find the trapdoor.');}
function pause(on){
  if(on){state='paused';const W=run.weapons.map(w=>`<span>${WEAP[w.id].name} ${w.lvl}</span>`).join(''),T=Object.keys(run.tomes).map(k=>`<span>${TOMES[k].name.replace('Tome of ','')} ${run.tomes[k]}</span>`).join(''),I=run.items.map(i=>`<span style="border-color:${hexs(ITEMS[i].col)}">${ITEMS[i].name}</span>`).join('');
    show(`<div class="panel narrow frame"><div class="kick px">${floorLabel()} · Lv ${run.level}</div><h2>Paused</h2>
      ${W?`<div class="tags">${W}</div>`:''}${T?`<div class="tags">${T}</div>`:''}${I?`<div class="tags">${I}</div>`:''}
      <div class="btns"><button class="btn" id="res">Resume</button><button class="btn ghost" id="quit">Abandon run</button></div></div>`);
    $('res').onclick=()=>pause(false);$('quit').onclick=()=>{run.hp=0;state='play';die();};}
  else{hide();state='play';last=performance.now();}}
let offers=[];
function makeOffers(){const pool=[];
  for(const w of run.weapons)if(w.lvl<5)pool.push({kind:'up',id:w.id,wt:3});
  if(run.weapons.length<4)for(const id in WEAP)if(!run.weapons.some(w=>w.id===id))pool.push({kind:'new',id,wt:2.2});
  for(const id in TOMES)if((run.tomes[id]||0)<(TOMES[id].max||5))pool.push({kind:'tome',id,wt:2});
  const out=[];while(out.length<3&&pool.length){let tot=pool.reduce((a,b)=>a+b.wt,0),r=Math.random()*tot,i=0;for(;i<pool.length;i++){r-=pool[i].wt;if(r<=0)break;}const o=pool.splice(Math.min(i,pool.length-1),1)[0];
    if(o.kind==='tome'&&!TOMES[o.id].flat){const q=Math.random();o.rar=q<.03?3:q<.13?2:q<.4?1:0;}else o.rar=0;out.push(o);}
  if(!out.length)out.push({kind:'heal',rar:0});return out;}
function openLevelUp(){
  state='levelup';offers=makeOffers();
  show(`<div class="panel frame"><div class="kick px">Level ${run.level}${run.pendingLv>1?` · ${run.pendingLv-1} more to pick`:''}</div><h2>Choose a mutation</h2>
    <div class="cards">${offers.map((o,i)=>{
      if(o.kind==='heal')return`<button class="card" data-i="${i}" style="--rc:#d8342c"><div class="row"><span class="key px">${i+1}</span><span class="role">Heal</span></div><div class="ico">${ICON.heal}</div><b>Stale Cheese</b><span class="d">Restore half your HP.</span></button>`;
      const T=o.kind==='tome'?TOMES[o.id]:null,W=WEAP[o.id],R=RAR[o.rar],lvl=o.kind==='up'?run.weapons.find(w=>w.id===o.id).lvl:0;
      const rc=o.kind==='new'?'#ff6a3a':o.kind==='up'?'#6ad06a':R.c,label=o.kind==='new'?'New weapon · '+W.role:o.kind==='up'?'Level '+(lvl+1):R.n+' tome';
      return`<button class="card" data-i="${i}" style="--rc:${rc}"><div class="row"><span class="key px">${i+1}</span><span class="role">${label}</span></div><div class="ico">${T?ICON.tome:ICON[o.id]}</div>
        <b>${T?T.name:W.name}</b><span class="d">${T?T.d(R.m):o.kind==='new'?W.desc:W.lv[lvl-1]}</span></button>`;}).join('')}</div></div>`);
  ov.querySelectorAll('.card').forEach(b=>b.onclick=()=>choose(offers[+b.dataset.i]));}
function choose(o){
  if(o.kind==='new')run.weapons.push({id:o.id,lvl:1,t:0});else if(o.kind==='up')run.weapons.find(w=>w.id===o.id).lvl++;
  else if(o.kind==='tome'){run.tomes[o.id]=(run.tomes[o.id]||0)+1;TOMES[o.id].ap(RAR[o.rar].m);}else run.hp=Math.min(st.maxHp,run.hp+st.maxHp*.5);
  run.pendingLv--;renderSlots();hud();if(run.pendingLv>0)openLevelUp();else{hide();state='play';last=performance.now();}}
function die(){
  state='dead';const nb=run.floor>best.floor||(run.floor===best.floor&&run.kills>best.kills);if(nb)Object.assign(best,{floor:run.floor,kills:run.kills,time:run.time});localStorage.setItem('scurry3.best',JSON.stringify(best));
  const C=CLASSES[run.cls],names={...Object.fromEntries(Object.entries(WEAP).map(([k,w])=>[k,w.name])),primary:PRIM[C.prim].name,special:SPECIALS[C.special].name,dot:'Poison & burn',bomb:'Bombs',runt:'The Runt',thorns:'Barbed Hide'};
  const dmg=Object.entries(run.dmgBy).sort((a,b)=>b[1]-a[1]),mx=dmg.length?dmg[0][1]:1;
  show(`<div class="panel narrow frame"><div class="kick px">${nb?'New best':'Run over'}</div><h1 style="font-size:clamp(64px,9vw,120px)">You died</h1>
    <div class="stat px"><div><b>${run.floor}</b><span>Floor</span></div><div><b>${run.kills}</b><span>Kills</span></div><div><b>${run.level}</b><span>Level</span></div><div><b>${fmt(run.time)}</b><span>Time</span></div></div>
    <div class="dbar">${dmg.map(([k,v])=>`<span>${names[k]||k}</span><i style="width:${v/mx*100}%"></i><span style="text-align:right">${commas(v)}</span>`).join('')}</div>
    <div class="btns"><button class="btn" id="again">Choose a rat</button><span class="px" style="font-size:12px;color:var(--dim)">or press R</span></div></div>`);
  $('again').onclick=menu;}

// ---------- loop ----------
let last=performance.now();
function loop(now){
  requestAnimationFrame(loop);const dt=Math.min(.05,(now-last)/1000);last=now;time+=dt;
  if(state==='play'){update(dt);hudT-=dt;if(hudT<=0){hudT=.08;hud();}}
  else if(state==='menu'){camYaw+=dt*.12;P.facing+=dt*.4;}
  sync(state==='play'||state==='menu'?dt:0);animate(dt);
  renderer.setRenderTarget(rt);renderer.render(scene,camera);renderer.setRenderTarget(null);renderer.render(postScene,postCam);}
menu();requestAnimationFrame(loop);
</script>
</body>
</html>
