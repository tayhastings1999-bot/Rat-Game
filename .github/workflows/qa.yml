# Regression gate: on every push and pull request, lint, build, run the
# scripted smoke test, then let the playtest bots replay the critical path,
# check freshly generated districts and run a short balance sweep.
# The playtest report is attached to the run as an artifact.
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full:
        description: Run the full playtest (all classes, longer sessions)
        type: boolean
        default: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium
        run: npx playwright-core install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - name: Smoke test
        run: npm run smoke
      - name: Playtest bots
        run: npm run playtest -- ${{ inputs.full && ' ' || '--quick' }}
      - name: Upload playtest report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playtest-report
          path: scripts/out/playtest/
