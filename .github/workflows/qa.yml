# The QA pipeline on every push and pull request, cheapest checks first:
#   1. boot gate       build, launch the production bundle, menu, start a run
#   2. system          scripted smoke test + UI sweep, math checks and fuzzing
#   3. feature lab     every new feature, level, mob or idea scored out of 100:
#                      T1 Works (gate) · T2 Holds up · T3 Plays well, with
#                      A/B ideas played against the control (scripts/lab.mjs)
# Each stage only runs if the one before passed. There is no nightly or soak
# run: bots only play when they are testing something new.
name: QA

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  boot:
    name: 1 · Boot gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run lint
      - run: npm run build
      - run: npm run test:boot

  system:
    name: 2 · System, UI and fuzz
    needs: boot
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - name: Smoke test (scripted end to end)
        run: npm run smoke
      - name: UI sweep, math checks, fuzzing
        run: npm run test:system
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: system-results, path: scripts/out/system/ }

  lab:
    name: 3 · Feature lab (tiered scores)
    needs: system
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright-core install --with-deps chromium
      - run: npm run lab -- --quick
      - if: always()
        run: cat scripts/out/lab/SCORES.md >> "$GITHUB_STEP_SUMMARY"
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: lab-report, path: scripts/out/lab/ }
